version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - ENV=production

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
